target-version = "py312"
line-length = 120
exclude = [
  ".git,",
  "__pycache__",
  "build",
  "xrayvison/version.py",
]

[lint]
select = [
  "E",
  "F",
  "W",
  "UP",
  "PT",
  "I"
]

extend-ignore = [
  # pycodestyle (E, W)
  "E501",  # ignore line length will use a formatter instead                             # TODO! fix
  # pytest (PT)
  "PT001", # Always use pytest.fixture()
  "PT007", # Parametrize should be lists of tuples  # TODO! fix
  "PT011", # Too broad exception assert             # TODO! fix
  "PT023", # Always use () on pytest decorators
]

[lint.per-file-ignores]
"setup.py" = [
  "INP001",  # File is part of an implicit namespace package.
]
"conftest.py" = [
  "INP001",  # File is part of an implicit namespace package.
]
"docs/conf.py" = [
  "E402", # Module imports not at top of file
  "I", # isort
]
"docs/*.py" = [
  "INP001", # File is part of an implicit namespace package.
]
"examples/**.py" = [
  "T201", # allow use of print in examples
  "INP001", # File is part of an implicit namespace package.
]
"__init__.py" = [
  "E402", # Module level import not at top of cell
  "F401", # Unused import
  "F403", # from {name} import * used; unable to detect undefined names
  "F405", # {name} may be undefined, or defined from star imports
  "I", # isort
]
"test_*.py" = [
  "E402", # Module level import not at top of cell
  "PT006"# Allway use `tuple` as first aeg to parametrise
]

[lint.pydocstyle]
convention = "numpy"

[lint.isort]
default-section = "third-party"
section-order = [
  "future",
  "standard-library",
  "third-party",
  "astropy",
  "sunpy",
  "first-party",
  "local-folder",
]
known-first-party = ["xrayvision"]
no-lines-before = ["local-folder"]

[lint.isort.sections]
"astropy" = ["astropy", "asdf", "gwcs", "reproject"]
"sunpy" = ["sunpy"]
